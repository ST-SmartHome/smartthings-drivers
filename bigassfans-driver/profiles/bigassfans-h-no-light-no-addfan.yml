name: bigassfans-h-no-light-no-addfan.v6
components:
  - id: main
    label: "Fan"
    capabilities:
      - id: switch
        version: 1
      - id: fanSpeed
        version: 1
        config:
          values:
            - key: "fanSpeed.value"
              range: [0, 7]
      - id: refresh
        version: 1
      - id: examplens.fanMode
        version: 1
      - id: examplens.fanDirection
        version: 1
      - id: examplens.whoosh
        version: 1
      - id: examplens.ecoMode
        version: 1
      - id: examplens.sleepMode
        version: 1
    categories:
      - name: Fan
  - id: settings
    label: "Settings"
    capabilities:
      - id: examplens.ledIndicators
        version: 1
      - id: examplens.fanBeep
        version: 1
      - id: examplens.legacyIrRemote
        version: 1
      - id: temperatureMeasurement
        version: 1
  - id: sleep
    label: "Sleep"
    capabilities:
      - id: examplens.wakeUpMotionTimeout
        version: 1
      - id: examplens.sleepAutoMode
        version: 1
      - id: examplens.sleepIdealTemperature
        version: 1
      - id: examplens.sleepTimer
        version: 1
      - id: examplens.sleepTimerDuration
        version: 1
      - id: examplens.sleepReturnToAuto
        version: 1
      - id: examplens.sleepReturnToAutoDuration
        version: 1
      - id: examplens.sleepBrightnessMode
        version: 1
      - id: examplens.wakeUpMode
        version: 1
      - id: examplens.wakeUpBrightness
        version: 1
