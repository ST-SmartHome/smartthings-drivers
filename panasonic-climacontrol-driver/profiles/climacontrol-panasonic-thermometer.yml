name: climacontrol-panasonic-thermometer.v1
components:
  - id: main
    label: "Air Conditioner"
    capabilities:
      - id: switch
        version: 1
      - id: airConditionerMode
        version: 1
      - id: airConditionerFanMode
        version: 1
      - id: thermostatCoolingSetpoint
        version: 1
      - id: temperatureMeasurement
        version: 1
      - id: aboutisland47519.preset
        version: 1
      - id: aboutisland47519.verticalVane
        version: 1
      - id: aboutisland47519.horizontalVane
        version: 1
      - id: powerMeter
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: AirConditioner
  - id: outdoor
    label: "Outdoor Unit"
    capabilities:
      - id: temperatureMeasurement
        version: 1
  - id: eco
    label: "Eco"
    capabilities:
      - id: switch
        version: 1
  - id: econavi
    label: "Eco Navi"
    capabilities:
      - id: switch
        version: 1
  - id: nanoex
    label: "nanoe X"
    capabilities:
      - id: switch
        version: 1
  - id: milddry
    label: "Mild Dry"
    capabilities:
      - id: switch
        version: 1
  - id: thermometer
    label: "Wireless Thermometer"
    capabilities:
      - id: temperatureMeasurement
        version: 1
      - id: relativeHumidityMeasurement
        version: 1
      - id: aboutisland47519.sensorBattery
        version: 1
  - id: module
    label: "Module"
    capabilities:
      - id: aboutisland47519.indoorUnitLink
        version: 1
      - id: aboutisland47519.temperatureInput
        version: 1
      - id: aboutisland47519.roomGuard
        version: 1
      - id: aboutisland47519.wifiSignal
        version: 1
      - id: aboutisland47519.ipAddress
        version: 1
      - id: aboutisland47519.macAddress
        version: 1
      - id: aboutisland47519.firmware
        version: 1
      - id: aboutisland47519.uptime
        version: 1
      - id: aboutisland47519.moduleId
        version: 1
      - id: aboutisland47519.restartModule
        version: 1
preferences:
  - title: "IP Address (optional)"
    name: ipAddress
    description: "Leave as 0.0.0.0 to find the module automatically. Enter its IP only if it isn't found (e.g. it's on another network segment)"
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 7
      maxLength: 15
      default: "0.0.0.0"
  - title: "Module Password"
    name: modulePassword
    description: "Only if the module has a web password set (it then asks for one on its own web page). Leave empty otherwise"
    required: false
    preferenceType: string
    definition:
      stringType: password
      maxLength: 64
  - title: "Cooling only"
    name: coolingOnly
    description: "The unit has no heating: Heat is left out of the modes"
    required: true
    preferenceType: boolean
    definition:
      default: false
  - title: "Unit features"
    name: unitFeatures
    description: "Which Panasonic extras this unit has; the others are left out. All extras: shows everything. nanoe X models: e.g. Z/HZ series (2019+). Eco Navi models: older units with Eco Navi. Basic: e.g. cooling-only U series"
    required: true
    preferenceType: enumeration
    definition:
      options:
        all: "All extras"
        nanoex: "nanoe X models"
        econavi: "Eco Navi models"
        basic: "Basic (none)"
      default: all
  - title: "Poll Interval (seconds)"
    name: pollInterval
    description: "How often to read the air conditioner's status"
    required: true
    preferenceType: integer
    definition:
      minimum: 5
      maximum: 300
      default: 15
  - title: "Room guard"
    name: roomGuard
    description: "The module's temperature guard: while the unit is off, it switches it on if the room gets colder or warmer than the range below. Leave as set keeps the module's own setting (shown on the Module tile)"
    required: true
    preferenceType: enumeration
    definition:
      options:
        module: "Leave as set on the module"
        "on": "On"
        "off": "Off"
      default: module
  - title: "Room guard lowest (°C)"
    name: roomGuardLow
    description: "5 to 40 °C, the module's limits. The guard switches the unit on below this. Use 5 on a cooling-only unit so it never tries to heat. Sent to the module only when you change it"
    required: true
    preferenceType: integer
    definition:
      minimum: 5
      maximum: 40
      default: 5
  - title: "Room guard highest (°C)"
    name: roomGuardHigh
    description: "5 to 40 °C, the module's limits, and above the lowest. The guard switches the unit on above this. Sent to the module only when you change it"
    required: true
    preferenceType: integer
    definition:
      minimum: 5
      maximum: 40
      default: 40
  - title: "Mode change turns the unit on"
    name: modeTurnsOn
    description: "Choosing a mode while the air conditioner is off also switches it on, like the remote"
    required: true
    preferenceType: boolean
    definition:
      default: true
